  chunk_overlap_tokens: 128
  total_input_tokens: 65536
  max_new_tokens: 256
  max_images_per_call: 9
  image_max_pixels: 1048576
  do_sample: false
  format_retry: 1
  read_retry: 1
policy:
  compare_whitelist:
  - EQ
  - LE
  - GE
  - WITHIN
  - IN_SET
  - AUTHORIZED
  require_source_quotes: true
  unresolved_action: review
heads:
  dropout: 0.0
  candidate_batch: 8
  learning_rate: 0.0003
  weight_decay: 0.01
  batch_conditions: 16
  max_epochs: 20
