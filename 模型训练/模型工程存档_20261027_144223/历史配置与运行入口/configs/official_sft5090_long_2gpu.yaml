  patience: 3
  rho_relative: 0.03
  perturb_steps: 1
  mixture_correct: 0.4
  mixture_natural_error: 0.3
  mixture_perturbed: 0.3
thresholds:
  reference: 0.6
  support: 0.7
  conflict: 0.7
  negative_contribution: -0.05
  missed_contribution: 0.15
lora:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.05
  last_text_layers: 12
  target_suffixes:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  learning_rate: 2.0e-05
  max_epochs: 3
  per_device_batch: 1
  gradient_accumulation: 8
environment:
  profile: smoke
  python_versions:
  - '3.11'
  - '3.12'
  required_gpu_count: 2
  minimum_gpu_memory_gib: 24
